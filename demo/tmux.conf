set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g allow-passthrough on
set -g mouse on
set -g mode-keys vi
set -g escape-time 10
set -g history-limit 20000
set -g base-index 1
set -g status-position bottom
set -g status-style "bg=#161b22,fg=#8b949e"
set -g status-left "#[bg=#3fb950,fg=#0d1117,bold] #S #[bg=#161b22] "
set -g status-left-length 20
set -g status-right "#[fg=#8b949e]#{pane_current_path}  #[fg=#f0b429,bold]#h "
set -g status-right-length 60
set -g window-status-current-format "#[fg=#e6edf3,bold]#I:#W"
set -g window-status-format "#[fg=#8b949e]#I:#W"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#3fb950"
set -g popup-border-style "fg=#3fb950"
set -g popup-border-lines rounded
set -g message-style "bg=#f0b429,fg=#0d1117,bold"
set -g mode-style "bg=#264f78,fg=#e6edf3"
run-shell ~/.tmux/plugins/tmux-opener/tmux-opener.tmux
