name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual package build.
        required: false
        default: dev

permissions:
  contents: read

jobs:
  package:
    name: Package release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux

      - name: Validate shell scripts
        run: shellcheck tmux-opener.tmux scripts/package-artifact scripts/package-client scripts/package-server-plugin

      - name: Run tests
        run: uv run --frozen --group dev pytest

      - name: Build release archives
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME:-dev}}"
          scripts/package-server-plugin "${version}"
          scripts/package-client "${version}"

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: tmux-opener-release
          path: |
            dist/tmux-opener-server-*.tar.gz
            dist/tmux-opener-server-*.tar.gz.sha256
            dist/tmux-opener-client-*.tar.gz
            dist/tmux-opener-client-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: tmux-opener-release
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="tmux-opener ${tag}"
          notes="tmux-opener ${tag} release with both server-side tmux plugin and local desktop client artifacts."

          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "${title}" --notes "${notes}"

          gh release upload "${tag}" dist/* --clobber
